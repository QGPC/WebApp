<style>
.nbtn{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid #0157AE;background:#fff;color:#0157AE;font:600 14px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.nbtn:disabled{opacity:.45;cursor:default}
.nbtn.del{border-color:#9A3412;color:#9A3412}
.nbtn.solid{background:#0157AE;color:#fff}
.cqc{background:#fff;border:1px solid #E4E0D6;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.cqc>h2,.cqh h2{margin:0;font:400 24px 'Young Serif',Georgia,serif}
.cqh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sub{margin:2px 0 0;color:#5A5F6E;font-size:15px}
.cbadge{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:#E87446;color:#1F2433;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.pl{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#EEF1F8;color:#0157AE;white-space:nowrap}
.pl.gray{background:#F0ECE3;color:#454A58}
.pl.new{background:#E87446;color:#1F2433}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid #0157AE;background:#fff;color:#0157AE;font:600 14px var(--sans);cursor:pointer}
.seg button[aria-pressed=true]{background:#0157AE;color:#fff}
.confirm{background:#FCEEE9;border-radius:10px;padding:12px 14px}.confirm p{margin:0 0 10px;font-weight:600;color:#9A3412}
.infobox{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-radius:14px;background:#EEF1F8}
.infobox h2{margin:0 0 4px;font-size:16px;font-weight:700;color:#0157AE}.infobox p{margin:0;font-size:15px;line-height:1.5;color:#1F2433}
.blue-note{border:2px solid #0157AE;border-radius:14px;padding:16px 18px;background:#F4F6FB;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.blue-note h3{margin:0;font-size:17px}.blue-note ul{margin:8px 0 0;padding-left:20px;line-height:1.5}
.empty{margin:0;padding:14px 16px;border-radius:12px;background:#F0ECE3;color:#454A58}
.toplinks{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.dl2{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}.dl2 dt{font-weight:700;color:#5A5F6E}.dl2 dd{margin:0}
.lbl{display:block;font-weight:600;font-size:15px;margin:0 0 6px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

.asec{display:flex;flex-direction:column;gap:14px}
.asec .h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.asec .h h2{margin:0;font:400 24px 'Young Serif',Georgia,serif}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.acard{position:relative;display:flex;align-items:flex-start;gap:14px;min-height:96px;padding:18px;box-sizing:border-box;background:#fff;border:1px solid #E4E0D6;border-radius:14px;text-decoration:none;color:#1F2433}
a.acard:hover,a.acard:focus-visible{border-color:#0157AE}
.acard img{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:block}
.acard .tx{display:flex;flex-direction:column;gap:4px}.acard .tx b{font-size:17px;font-weight:600}.acard .tx span{font-size:14px;color:#5A5F6E;line-height:1.45}
.acard.soon{background:#FAF8F3;color:#5A5F6E;cursor:default}.acard.soon img{opacity:.55}
.acard .cs{font-size:12px;font-weight:700;color:#454A58;background:#F0ECE3;border-radius:999px;padding:2px 8px;align-self:flex-start;margin-top:2px;white-space:nowrap}
</style>
</head><body>

</div></div></header>

<section class="banner hst" aria-labelledby="pg-title"><div class="banner-in" style="padding:32px 24px 40px;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">

<script src="assets/js/comfort.js"></script>
<script>
QGPCShell.start({need:function(c){return c.isAdmin;}},function(ctx){
  var $=function(i){return document.getElementById(i)};
  var C=QGPCComfort,el=C.el;
  document.querySelector('.eyebrow').textContent=ctx.isSuper?'Superuser':'Administrator';
  // href null = not built yet (shown as "Coming soon", not a link)
  var SECTIONS=[
    {title:'Administrator',cards:[
      ['Manage Notices','manage-notices','notices-manage.html','Post, pin, edit and remove notices.'],
      ['Email Members','messages','email-members.html','Write one email and send it to every current member.'],
      ['Guild History','about-our-guild','guild-history-manage.html','Edit the introduction and timeline on the Guild History page.'],
      ['Calendars','manage-events','calendars-manage.html','Choose which calendars feed the events card and the Full calendar page, and add new ones.'],
      ['Workshop Settings','site-settings','workshop-settings.html','Set the maximum workshop subsidy and the non-member workshop fee.'],
      ['Assign Roles','roles-and-permissions','roles.html','Assign and reassign board and committee roles.'],
      ['Backups','site-administration',null,'Back up the site, see the last backup and set reminders.'],
      ['Reported Messages','reported-messages',null,'Review private messages that members have reported.']
    ]},
    {title:'Superuser',superOnly:true,cards:[
      ['Administrators','roles-and-permissions','roles.html','Grant or remove Administrator access.'],
      ['Site Settings','site-settings',null,'Site-wide options and configuration.'],
      ['Site Appearance','gallery',null,'Choose the banner color and pattern used on every page.'],
      ['Import Members','membership',null,'Load the first member list from a CSV file.'],
      ['Reset the Site','site-administration',null,'Clear test activity before the Guild goes live.'],
      ['Restore from a Backup','site-administration',null,'Put the site back from a saved backup.']
    ]}
  ];
  var box=$('secs');
  SECTIONS.forEach(function(s){
    if(s.superOnly&&!ctx.isSuper)return;
    var sec=el('section','asec'),h=el('div','h');h.appendChild(el('h2',null,s.title));
    if(s.superOnly)h.appendChild(el('span','pl','Superuser only')).style.cssText='background:#FCEEE9;color:#9A3412';
    sec.appendChild(h);var g=el('div','agrid');
    s.cards.forEach(function(c){
      var a=c[2]?el('a','acard'):el('div','acard soon');if(c[2])a.href=c[2];
      var im=el('img');im.src='assets/tiles/'+c[1]+'.svg';im.alt='';im.width=44;im.height=44;a.appendChild(im);
      var tx=el('span','tx');tx.appendChild(el('b',null,c[0]));tx.appendChild(el('span',null,c[3]));a.appendChild(tx);
      if(!c[2])a.appendChild(el('span','cs','Coming soon'));
      g.appendChild(a);
    });
    sec.appendChild(g);box.appendChild(sec);
  });
});
</script>
