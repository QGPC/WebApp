<style>



.cqc>h2,.cqh h2{margin:0;font:400 var(--fs-xl) 'Young Serif',Georgia,serif}
.sub{margin:2px 0 0;color:var(--muted);font-size:var(--fs-md)}
.pl{font-size:var(--fs-sm);font-weight:700;padding:4px 10px;border-radius:999px;background:var(--mist);color:var(--cobalt);white-space:nowrap}
.pl.gray{background:var(--sand);color:var(--muted-dark)}
.pl.new{background:var(--persimmon);color:var(--ink)}

.infobox p{margin:0;font-size:var(--fs-md);line-height:1.5;color:var(--ink)}
.blue-note h3{margin:0;font-size:var(--fs-lg)}.blue-note ul{margin:8px 0 0;padding-left:20px;line-height:1.5}
.empty{margin:0;padding:14px 16px;border-radius:12px;background:var(--sand);color:var(--muted-dark)}
.lbl{display:block;font-weight:600;font-size:var(--fs-md);margin:0 0 6px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

.asec{display:flex;flex-direction:column;gap:14px}
.asec .h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.asec .h h2{margin:0;font:400 var(--fs-xl) 'Young Serif',Georgia,serif}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.acard{position:relative;display:flex;align-items:flex-start;gap:14px;min-height:96px;padding:18px;box-sizing:border-box;background:#fff;border:1px solid var(--edge);border-radius:14px;text-decoration:none;color:var(--ink)}
a.acard:hover,a.acard:focus-visible{border-color:var(--cobalt)}
.acard img{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:block}
.acard .tx{display:flex;flex-direction:column;gap:4px}.acard .tx b{font-size:var(--fs-lg);font-weight:600}.acard .tx span{font-size:var(--fs-sm);color:var(--muted);line-height:1.45}
.acard.soon{background:var(--cream);color:var(--muted);cursor:default}.acard.soon img{opacity:.55}
.acard .cs{font-size:var(--fs-sm);font-weight:700;color:var(--muted-dark);background:var(--sand);border-radius:999px;padding:2px 8px;align-self:flex-start;margin-top:2px;white-space:nowrap}
</style>
</head><body>

</div></div></header>

<section class="banner hst" aria-labelledby="pg-title"><div class="banner-in" style="padding:32px 24px 40px;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
<div class="greet-card" style="flex-direction:column;align-items:flex-start;gap:8px;padding:24px 28px;min-height:0;max-width:640px"><span class="eyebrow">Administrator</span>

<script src="assets/js/comfort.js?v=20261118f"></script>
<script>
QGPCShell.start({need:function(c){return c.isAdmin;}},function(ctx){
  var $=function(i){return document.getElementById(i)};
  var C=QGPCComfort,el=C.el;
  document.querySelector('.eyebrow').textContent=ctx.isSuper?'Superuser':'Administrator';
  // href null = not built yet (shown as "Coming soon", not a link)
  var SECTIONS=[
    {title:'Administrator',cards:[
      ['Manage Notices','manage-notices','notices-manage.html','Post, edit and remove notices.'],
      ['Email Members','messages','email-members.html','Write one email and send it to every current member.'],
      ['Privacy Notice','about','privacy-manage.html','Edit the text of the public Privacy Notice page.'],
      ['Welcome Message','about','welcome-message-manage.html','Edit the welcome paragraph visitors read on the Welcome page.'],
      ['Facebook Link','about-our-guild','facebook-link.html','Set the address of the Guild\u2019s Facebook page shown in the header of every page.'],
      ['Calendars','manage-events','calendars-manage.html','Choose which calendars feed the events card and the Full calendar page, and add new ones.'],
      ['Workshop Settings','site-settings','workshop-settings.html','Set the maximum workshop subsidy and the non-member workshop fee.'],
      ['Quilting Interests','block-of-the-month','interests-manage.html','Add, rename and delete the interest choices members can check.'],
      ['Assign Roles','roles-and-permissions','roles.html','Assign and reassign board and committee roles.'],
      ['Backups','site-administration','backups.html','Back up the site, see the last backup and set reminders.'],
      ['Reported Messages','reported-messages','reported-messages.html','Review private messages that members have reported.']
    ]},
    {title:'Superuser',superOnly:true,cards:[
      ['Administrators','roles-and-permissions','roles.html','Grant or remove Administrator access.'],
      ['Site Appearance','gallery','site-appearance.html','Choose the banner color and pattern used on every page.'],
      ['Import Members','membership','member-import.html','Load the first member list from a CSV file.'],
      ['Reset the Site','site-administration','reset-site.html','Clear test activity before the Guild goes live.'],
      ['Restore from a Backup','site-administration','restore-site.html','Put the site back from a saved backup.']
    ]}
  ];
  // a banner when a backup is due
  QGPC.sb.rpc('backup_status').then(function(r){
    var d=r&&r.data;if(r.error||!d||!d.due)return;
    var n=d.days_until_due,b=el('section','blue-note');b.setAttribute('role','alert');b.style.cssText='border-color:#E87446;background:#FCEEE9';
    var tx=el('div');tx.appendChild(el('h3',null,'Time for a backup'));
    tx.appendChild(el('p',null,d.never?'No backup of the site has been made yet.':'A backup was due '+(n<0?(-n)+' day'+(n===-1?'':'s')+' ago':'today')+'. A backup made by anyone clears this reminder for everyone.'));
    b.appendChild(tx);var a=el('a','nbtn solid','Go to Backups');a.href='backups.html';b.appendChild(a);
    $('content').insertBefore(b,$('secs'));
  });
  var box=$('secs');
  SECTIONS.forEach(function(s){
    if(s.superOnly&&!ctx.isSuper)return;
    var sec=el('section','asec'),h=el('div','h');h.appendChild(el('h2',null,s.title));
    if(s.superOnly)h.appendChild(el('span','pl','Superuser only')).style.cssText='background:#FCEEE9;color:#9A3412';
    sec.appendChild(h);var g=el('div','agrid');
    s.cards.forEach(function(c){
      var a=c[2]?el('a','acard'):el('div','acard soon');if(c[2])a.href=c[2];
      var im=el('img');im.src='assets/tiles/'+c[1]+'.svg';im.alt='';im.width=44;im.height=44;a.appendChild(im);
      var tx=el('span','tx');tx.appendChild(el('b',null,c[0]));tx.appendChild(el('span',null,c[3]));a.appendChild(tx);
      if(!c[2])a.appendChild(el('span','cs','Coming soon'));
      g.appendChild(a);
    });
    sec.appendChild(g);box.appendChild(sec);
  });
  // how many reported messages are waiting, on that card
  QGPC.sb.rpc('reported_messages_waiting').then(function(r){
    var n=(!r.error&&r.data>0)?r.data:0,a=box.querySelector('a[href="reported-messages.html"]');if(!n||!a)return;
    var b=el('span','cbadge',String(n));b.setAttribute('aria-hidden','true');b.style.color='var(--ink)';a.querySelector('b').appendChild(b);
    a.querySelector('.tx').appendChild(el('span','nw',n===1?'1 report waiting':n+' reports waiting'));
  });
});
</script>
</body></html>
